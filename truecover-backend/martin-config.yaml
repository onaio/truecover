# Martin configuration for serving PostGIS vector tiles and PMTiles
# Serves pixels, locations, and admin boundaries as vector tiles

postgres:
  connection_string: "postgresql://truecover:truecover@postgres:5432/truecover"

  # Define function-based sources for dynamic filtering
  functions:
    # Function to serve pixels filtered by area_id
    pixels_by_area:
      schema: public
      function: pixels_by_area
      minzoom: 0
      maxzoom: 24

    # Function to serve locations filtered by area_id
    locations_by_area:
      schema: public
      function: locations_by_area
      minzoom: 0
      maxzoom: 24

# PMTiles sources for admin boundaries and buildings
pmtiles:
  sources:
    # ADM0 - Country level boundaries
    bgd_adm0:
      path: /pmtiles/bgd_adm0.pmtiles

    # ADM1 - Division level boundaries
    bgd_adm1:
      path: /pmtiles/bgd_adm1.pmtiles

    # ADM2 - District level boundaries
    bgd_adm2:
      path: /pmtiles/bgd_adm2.pmtiles

    # ADM3 - Upazila level boundaries
    bgd_adm3:
      path: /pmtiles/bgd_adm3.pmtiles

    # ADM4 - Union level boundaries
    bgd_adm4:
      path: /pmtiles/bgd_adm4.pmtiles

    # Overture Maps buildings layer
    buildings:
      path: https://overturemaps-tiles-us-west-2-beta.s3.amazonaws.com/2025-10-22/buildings.pmtiles
