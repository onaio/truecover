version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: truecover-postgres
    environment:
      POSTGRES_USER: truecover
      POSTGRES_PASSWORD: truecover
      POSTGRES_DB: truecover
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truecover"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
