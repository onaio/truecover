version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: truecover-postgres
    environment:
      POSTGRES_USER: truecover
      POSTGRES_PASSWORD: truecover
      POSTGRES_DB: truecover
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truecover"]
      interval: 10s
      timeout: 5s
      retries: 5

  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: truecover-martin
    ports:
      - "3051:3000"
    environment:
      - DATABASE_URL=postgresql://truecover:truecover@postgres:5432/truecover
    volumes:
      - ./martin-config.yaml:/config/config.yaml
      - ../pmtiles:/pmtiles
    command: --config /config/config.yaml
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: truecover-temporal
    ports:
      - "7233:7233"  # gRPC
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=truecover
      - POSTGRES_PWD=truecover
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    container_name: truecover-temporal-ui
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal

volumes:
  postgres_data:
