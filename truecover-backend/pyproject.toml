[project]
name = "truecover-backend"
version = "0.1.0"
description = "Geospatial disease surveillance platform backend API"
requires-python = ">=3.12"
dependencies = [
    "flask==3.0.0",
    "flask-cors==4.0.0",
    "clerk-backend-api==3.3.1",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.0",
    "requests==2.31.0",
    "gunicorn==21.2.0",
    "mercantile>=1.2.1",
    "shapely>=2.0.0",
    "pystac-client>=0.7.0",
    "rasterstats>=0.19.0",
    "geopandas>=0.14.0",
    "rasterio>=1.3.0",
    "pyarrow>=22.0.0",
    "overturemaps>=0.17.0",
    "duckdb>=1.0.0",
    "temporalio>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
