{{- if .Values.tiles.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "truecover.fullname" . }}-tiles
  labels:
    {{- include "truecover.labels" . | nindent 4 }}
    app.kubernetes.io/component: tiles
spec:
  type: {{ .Values.tiles.service.type }}
  ports:
    - port: {{ .Values.tiles.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "truecover.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: tiles
{{- end }}
