apiVersion: v1
kind: Secret
metadata:
  name: {{ include "truecover.fullname" . }}
  labels:
    {{- include "truecover.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Backend secrets
  DATABASE_URL: "postgresql://{{ .Values.backend.database.username }}:{{ .Values.backend.database.password }}@{{ .Values.backend.database.host }}:{{ .Values.backend.database.port }}/{{ .Values.backend.database.name }}"
  CLERK_SECRET_KEY: {{ .Values.backend.clerk.secretKey | quote }}
  # Frontend secrets (used at build time, included for reference)
  VITE_MAPBOX_TOKEN: {{ .Values.frontend.mapbox.token | quote }}
  VITE_CLERK_PUBLISHABLE_KEY: {{ .Values.frontend.clerk.publishableKey | quote }}
