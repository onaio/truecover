# Secrets configuration - encrypt with SOPS before committing
# Example: sops --encrypt --in-place secrets.yaml

backend:
  database:
    username: ENC[AES256_GCM,data:PLACEHOLDER,type:str]
    password: ENC[AES256_GCM,data:PLACEHOLDER,type:str]
  clerk:
    secretKey: ENC[AES256_GCM,data:PLACEHOLDER,type:str]

frontend:
  mapbox:
    token: ENC[AES256_GCM,data:PLACEHOLDER,type:str]
  clerk:
    publishableKey: ENC[AES256_GCM,data:PLACEHOLDER,type:str]

# SOPS configuration - update with your KMS/PGP keys
sops:
  kms: []
  gcp_kms: []
  azure_kv: []
  hc_vault: []
  age: []
  pgp: []
  unencrypted_suffix: _unencrypted
  version: 3.7.2
