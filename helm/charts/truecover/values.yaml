---
# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []

# Backend configuration
backend:
  enabled: true
  replicaCount: 1

  image:
    repository: truecover-backend
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5000

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  # Environment variables
  env:
    FLASK_ENV: "production"
    PYTHONUNBUFFERED: "1"

  # Database configuration
  database:
    host: "postgres"
    port: "5432"
    name: "truecover"
    username: ""  # Set in secrets.yaml
    password: ""  # Set in secrets.yaml

  # Clerk configuration
  clerk:
    secretKey: ""  # Set in secrets.yaml

  # Temporal configuration
  temporal:
    host: "temporal"
    port: "7233"
    namespace: "default"

  # Health check configuration
  livenessProbe:
    httpGet:
      path: /health
      port: 5000
    initialDelaySeconds: 30
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /health
      port: 5000
    initialDelaySeconds: 5
    periodSeconds: 5

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 1

  image:
    repository: truecover-app
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: "10m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

  # Build-time environment variables (baked into the image)
  # These are used during docker build, not runtime
  buildEnv:
    VITE_API_URL: ""
    VITE_MARTIN_URL: ""

  # Secrets (set in secrets.yaml)
  mapbox:
    token: ""
  clerk:
    publishableKey: ""

  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5

# Tiles (Martin) configuration
tiles:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/maplibre/martin
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

  livenessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 5

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: letsencrypt-production
    ona.io/use-external-dns: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

  tls:
    enabled: true
    secretName: truecover-tls

  hosts:
    frontend: truecover.example.com
    api: api.truecover.example.com
    tiles: tiles.truecover.example.com

# Service account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext: {}

# Security context
securityContext: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
